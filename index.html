<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Social links profile</title>
  
</head>
<body>
<section class="profile-card">
  <img src="assets/images/avatar-jessica.jpeg" alt="headshot of Jessica Randal">
  <p class="profile-name">Jessica Randall</p>
  <address class="profile-locale">London, United Kingdom</address>
  <p class="profile-title">"Front-end developer and avid reader."</p>

  <nav>
    <a class="link" href="#">Github</a>
    <a class="link" href="#">Frontend Mentor</a>
    <a class="link" href="#">LinkedIn</a>
    <a class="link" href="#">Twitter</a>
    <a class="last link" href="#">Instagram</a>
  </nav>
</section>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Efosa</a>.
  </footer>
</body>
</html>
